<script>

      const circle = document.createElement('span');
      circle.classList.add('absolute', 'rounded-full', 'bg-white/20', 'pointer-events-none', 'animate-ping');
      circle.style.width = circle.style.height = '40px';
      circle.style.left = (e.offsetX - 20) + 'px';
      circle.style.top = (e.offsetY - 20) + 'px';
      this.appendChild(circle);
      setTimeout(() => circle.remove(), 400);
    });
